<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024" fill="none">
  <!-- Diamond Die Logo in #5E6FF8 with transparent cutout dots -->
  <defs>
    <mask id="die-cutout">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <circle cx="12" cy="7.3" r="1.35" fill="#000000"/>
      <circle cx="16.7" cy="12" r="1.35" fill="#000000"/>
      <circle cx="12" cy="16.7" r="1.35" fill="#000000"/>
      <circle cx="7.3" cy="12" r="1.35" fill="#000000"/>
