<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Isometric 3D Die / Cube -->
  <!-- Top Face -->
  <polygon points="12 2 21 6.8 12 11.6 3 6.8" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <!-- Left Face -->
  <polygon points="3 6.8 12 11.6 12 21.6 3 16.8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.8"/>
  <!-- Right Face -->
  <polygon points="12 11.6 21 6.8 21 16.8 12 21.6" fill="#11151c" stroke="#58a6ff" stroke-width="1.8"/>
  
  <!-- Dots on Top Face (Value 3 - diagonal) -->
  <circle cx="7.5" cy="5.2" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="12" cy="6.8" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="16.5" cy="8.4" r="1.1" fill="#f0f6fc" stroke="none"/>
  
  <!-- Dots on Left Face (Value 2) -->
  <circle cx="6.5" cy="11" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="8.5" cy="17.4" r="1.1" fill="#f0f6fc" stroke="none"/>
  
  <!-- Dots on Right Face (Value 6) -->
  <circle cx="15" cy="10.2" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="18" cy="8.6" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="15" cy="14" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="18" cy="12.4" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="15" cy="17.8" r="1.1" fill="#f0f6fc" stroke="none"/>
  <circle cx="18" cy="16.2" r="1.1" fill="#f0f6fc" stroke="none"/>
</svg>
